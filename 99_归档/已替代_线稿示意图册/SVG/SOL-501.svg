<text x="40.00" y="258.00" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.7" text-anchor="start" font-weight="normal" fill="#000">电路:每面 1 串 → JST-XH 2P → EPS(J4-J7);SS34 旁路二极管每串 2 只(共 8); TVS SMBJ15A 板端</text>
<text x="40.00" y="253.00" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.7" text-anchor="start" font-weight="normal" fill="#000">BOL 总功率 18.4W(OAP 3.4W);日发电 ≈74Wh vs 日耗 ≈30Wh(裕量 2.5×);LT3652×4 每面独立 MPPT</text>
