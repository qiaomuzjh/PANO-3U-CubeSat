<text x="262.00" y="146.20" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.75" text-anchor="start" font-weight="normal" fill="#000">1. 片 22.6×34 切割片,0.256W/片 BOL;</text>
<text x="262.00" y="150.50" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.75" text-anchor="start" font-weight="normal" fill="#000">2. 贴片:3M 966 胶带,贴片区(92×71×3 段)</text>
<text x="262.00" y="154.80" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.75" text-anchor="start" font-weight="normal" fill="#000">   导电氧化面;贴片前等离子清洗;</text>
<text x="262.00" y="159.10" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.75" text-anchor="start" font-weight="normal" fill="#000">3. 互连条焊接后点 CW2400 导电胶补强;</text>
<text x="262.00" y="163.40" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.75" text-anchor="start" font-weight="normal" fill="#000">4. 旁路二极管 SS34 每串 2 只,共 8 只;</text>
<text x="262.00" y="167.70" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.75" text-anchor="start" font-weight="normal" fill="#000">5. 引线经 MEC-103B P1 Ø6 孔入舱(护套);</text>
<text x="262.00" y="172.00" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.75" text-anchor="start" font-weight="normal" fill="#000">6. 贴片后测母线-结构绝缘 ≥10 MΩ(A10);</text>
<text x="262.00" y="176.30" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.75" text-anchor="start" font-weight="normal" fill="#000">7. ±X 面中段让位于相机窗(Ø26)。</text>
