<text x="288.00" y="61.00" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.8" text-anchor="start" font-weight="normal" fill="#000">1. 包络 100.0×100.0×340.5mm,满足 CDS Rev.14 3U 构型;</text>
<text x="288.00" y="66.00" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.8" text-anchor="start" font-weight="normal" fill="#000">2. ±Z 端面无任何凸起;侧面凸起仅相机镜头 ≤6.0mm(&lt;6.5);</text>
<text x="288.00" y="71.00" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.8" text-anchor="start" font-weight="normal" fill="#000">3. 导轨 4 条 8.5×8.5,轨道中心距 91.5×91.5,硬质阳极氧化;</text>
<text x="288.00" y="76.00" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.8" text-anchor="start" font-weight="normal" fill="#000">4. 侧板 4 面 t1.5,太阳片 72 片:±Y 20 片/面(20S1P 11.4V),</text>
<text x="288.00" y="81.00" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.8" text-anchor="start" font-weight="normal" fill="#000">    ±X 16 片/面(16S1P 9.1V),均在 LT3652 输入范围;</text>
<text x="288.00" y="86.00" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.8" text-anchor="start" font-weight="normal" fill="#000">5. 相机模组对置 ±X 侧板,窗中心(Z=170, Y=50),重叠区 15°;</text>
<text x="288.00" y="91.00" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.8" text-anchor="start" font-weight="normal" fill="#000">6. 质心 z≈147mm(低于几何中心 170mm);总质量 2.83kg;</text>
<text x="288.00" y="96.00" font-family="'Segoe UI','Microsoft YaHei','SimHei',sans-serif" font-size="2.8" text-anchor="start" font-weight="normal" fill="#000">7. 未注孔位公差 ±0.05,加工以 DXF 为准。</text>
