<text x="20.00" y="234.00" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="4.6" text-anchor="start" font-weight="bold" fill="#000">技术要求</text>
<text x="20.00" y="241.00" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">1. 本图用于总装后包络检验(CDS Rev.14 §5.1):检具 100×100×340.5 通过;</text>
<text x="20.00" y="245.20" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">2. ±Z 端面不允许任何凸起;四个侧面凸起仅相机镜头 ≤6.0 mm(CDS 限值 6.5);</text>
<text x="20.00" y="249.40" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">3. 导轨中心距 91.5×91.5;导轨接触面共面度 ≤0.1(四轨投影仪检验);</text>
<text x="20.00" y="253.60" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">4. 质心 z=147±10 mm;总质量 ≤2.9 kg(称重验收);</text>
<text x="20.00" y="257.80" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">5. 检验时 P-POD 转接夹具配合面清洁无污染。</text>
