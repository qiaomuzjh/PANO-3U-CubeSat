<text x="20.00" y="241.00" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">1. 材料:6061-T6(GB/T 3880),铝板材,淬火人工时效状态;</text>
<text x="20.00" y="245.20" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">2. 热处理:无;</text>
<text x="20.00" y="249.40" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">3. 表面处理:表面导电氧化;氧化后禁止机加工</text>
<text x="20.00" y="253.60" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">4. 未注线性尺寸公差按 GB/T 1804-m;未注形位公差按 GB/T 1184-K;</text>
<text x="20.00" y="257.80" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">5. 未注圆角 R0.3;孔口倒角 C0.3;锐边倒钝 R0.2~0.4,去毛刺;</text>
<text x="20.00" y="262.00" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">6. 孔位公差 ±0.05;螺纹孔口倒角,攻丝后清屑;</text>
<text x="20.00" y="266.20" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">7. 用途:线束固定,间距≤80 mm;M2.5 螺钉+弹垫紧固;</text>
<text x="20.00" y="270.40" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="3.1" text-anchor="start" font-weight="normal" fill="#000">8. 单件质量 ≤1.5 g。</text>
